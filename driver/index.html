<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"><title>BASSE Delivery Driver</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="card"><div class="logo"></div><h1>BASSE Delivery</h1><p>Driver Portal</p><form id="driverLoginForm" onsubmit="event.preventDefault();login();"><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="WhatsApp number" required><input id="pin" inputmode="numeric" autocomplete="current-password" type="password" maxlength="6" minlength="4" placeholder="4–6 digit PIN" required><button id="loginBtn" type="submit">LOGIN</button><p id="loginError" style="display:none;color:#b42318;font-size:13px;margin:10px 0 0"></p></form><a href="/">← Back to marketplace</a></div></div>
<div id="app" class="hidden"><header><div><b> BASSE DELIVERY</b><small id="driverName"></small></div><button onclick="logout()">Logout</button></header><main><div class="location-banner"><b> GPS</b><span id="gpsState">Location sharing is OFF</span></div><section id="list"></section></main></div><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
