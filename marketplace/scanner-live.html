<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Ticket Scanner | BASSE ONLINE SHOP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#14213d;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#071a4a;color:#fff;padding:18px max(18px,env(safe-area-inset-left));font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:12px}
main{max-width:760px;margin:22px auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid #dfe6f2;border-radius:22px;padding:20px;box-shadow:0 8px 28px #13244b0a}
h1{font-size:clamp(25px,5vw,34px);margin:4px 0 8px}.muted{color:#637089;line-height:1.55}
video{display:block;width:100%;height:min(56dvh,560px);min-height:260px;object-fit:cover;background:#090d17;border-radius:18px;margin:16px 0}
button{background:#1748a8;color:white;border:0;border-radius:13px;padding:15px 16px;font:inherit;font-weight:850;width:100%;cursor:pointer;margin-top:10px}
.secondary{background:#edf2fa;color:#14213d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:800;margin:18px 0 7px}input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
.result{margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:13px;padding:14px;font-weight:850}
.result-good{background:#e8f8ee;color:#116329;border:1px solid #9ad8ad}.result-bad{background:#fff0f0;color:#9f1239;border:1px solid #f0b3bf}
@media(max-width:520px){main{margin:12px auto}.card{padding:15px}.row{grid-template-columns:1fr}video{height:50dvh;min-height:250px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
<header><span>BASSE ONLINE SHOP · LIVE SCANNER</span><button class="secondary" style="width:auto;margin:0;padding:9px 12px" onclick="location.assign('/scanner.html')">Exit</button></header>
<main><section class="card">
<h1>Scan a ticket</h1><p id="eventHint" class="muted">Authorized check-in · Each ticket can be used once.</p>
<video id="video" playsinline muted></video>
<div class="row"><button id="start" type="button">Start camera</button><button id="stop" type="button" class="secondary">Stop camera</button></div>
<label for="code">Or enter ticket code manually</label><input id="code" autocomplete="off" placeholder="Scan or enter ticket code">
<button id="verify" type="button">Verify ticket</button><p id="result" class="result" aria-live="polite"></p>
</section></main>
<script>
const $=id=>document.getElementById(id);let stream=null,loop=null,token=sessionStorage.getItem('basseScannerToken')||'',busy=false;
function showResult(ok,message){$('result').className='result '+(ok?'result-good':'result-bad');$('result').textContent=(ok?'✅ ':'⛔ ')+message}
function stopCamera(){if(loop)clearInterval(loop);loop=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}
async function verify(code){if(busy)return;code=String(code||'').trim();if(!/^.{8,100}$/.test(code)){showResult(false,'Enter or scan a valid ticket code.');return}if(!/^\d{8}$/.test(token)){showResult(false,'Scanner access expired. Exit and reopen the scanner using your 8-digit access code.');return}busy=true;$('verify').disabled=true;$('result').className='result';$('result').textContent='Checking ticket…';try{const r=await fetch('/api/events/scan',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({ticketCode:code})});let j={};try{j=await r.json()}catch{}const msg=j.message||j.error||'Ticket check failed.';showResult(r.ok&&j.ok,msg);if(r.ok&&j.ok){$('code').value='';$('code').focus()}}catch(e){showResult(false,'Connection error. Check internet and retry.')}finally{busy=false;$('verify').disabled=false}}
$('verify').onclick=()=>verify($('code').value);$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verify($('code').value)}});
$('stop').onclick=stopCamera;
async function startScanLoop(){
 const v=$('video');if(!stream||!v.videoWidth)return;
 const detector=('BarcodeDetector'in window)?new BarcodeDetector({formats:['qr_code']}):null;
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 loop=setInterval(async()=>{
  if(busy||v.readyState<2)return;
  try{
   let value='';
   if(detector){const found=await detector.detect(v);if(found.length)value=found[0].rawValue||''}
   else if(window.jsQR){canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height);const found=jsQR(frame.data,frame.width,frame.height,{inversionAttempts:'attemptBoth'});if(found)value=found.data}
   if(value){clearInterval(loop);loop=null;await verify(value);setTimeout(()=>{if(stream&&!loop)startScanLoop()},1600)}
  }catch{}
 },300)
}
$('start').onclick=async()=>{
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('This browser cannot access the camera. Open the secure HTTPS site in Safari or Chrome.');
  stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('video');v.srcObject=stream;await v.play();startScanLoop();
  $('result').className='result result-good';$('result').textContent='Camera ready. Point it at a ticket QR code.'
 }catch(e){showResult(false,e.message||'Could not open camera. Check browser camera permission.')}
};
if(!/^\d{8}$/.test(token)){showResult(false,'Scanner access missing. Exit and reopen using the 8-digit code.')}else{$('result').textContent='Opening camera…';$('start').click()}
window.addEventListener('pagehide',stopCamera);
</script>
</body>
</html>
