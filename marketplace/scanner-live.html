<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Ticket Scanner | BASSE ONLINE SHOP</title>
<style>
*{box-sizing:border-box}
:root{--ink:#0a1331;--blue:#1d55c9;--ok:#12b76a;--bad:#f04438;--line:#e5e9f0}
html,body{margin:0;background:#070b1a;color:#fff;font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:#0a1331}
.brand{font-size:12px;font-weight:700;letter-spacing:.14em;color:#c9d3ea}
.exit{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 12px}
h1{font-size:22px;font-weight:700;margin:0}
.sub{font-size:12px;color:#93a0c4;margin-top:3px}
.counts{display:flex;gap:8px}
.count{min-width:64px;text-align:center;border-radius:12px;padding:7px 10px;background:#111936;border:1px solid #1d2a55}
.count b{display:block;font-size:20px;line-height:1.1}.count small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#93a0c4}
.count.ok b{color:#47d391}.count.bad b{color:#ff8a80}
.cam{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:64dvh;width:100%;margin:0 auto;border:3px solid #1d2a55;transition:border-color .2s,box-shadow .3s}
.cam.ok{border-color:var(--ok);box-shadow:0 0 0 6px rgba(18,183,106,.25)}.cam.bad{border-color:var(--bad);box-shadow:0 0 0 6px rgba(240,68,56,.25)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05070f}
.frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.box{position:relative;width:64%;aspect-ratio:1}
.box i{position:absolute;width:34px;height:34px;border:4px solid #fff;opacity:.95}
.box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}.box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}.box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.box .line{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,#5aa2ff,transparent);animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{top:8%}50%{top:90%}}
.cam.ok .box i{border-color:var(--ok)}.cam.bad .box i{border-color:var(--bad)}.cam.ok .line,.cam.bad .line{display:none}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 6px #000}
.soundchip{position:absolute;top:12px;left:12px;z-index:3;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#0a1331;font:inherit;font-size:12px;font-weight:700;padding:8px 12px;cursor:pointer}
.soundchip[hidden]{display:none}
.verdict{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;animation:pop .28s ease-out}
.verdict[hidden]{display:none}
.verdict.ok{background:rgba(5,60,38,.92)}.verdict.bad{background:rgba(90,12,8,.93)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.vicon{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--ok);box-shadow:0 0 0 12px rgba(18,183,106,.28)}
.verdict.bad .vicon{background:var(--bad);box-shadow:0 0 0 12px rgba(240,68,56,.28)}
.vicon svg{width:60px;height:60px;stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.vtitle{font-size:clamp(26px,8vw,34px);font-weight:800;letter-spacing:.03em;margin-top:6px}
.vmsg{font-size:15px;color:#e5ecff;max-width:30ch;line-height:1.4}
.vmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.vmeta span{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button.act{border:0;border-radius:14px;padding:15px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;width:100%}
#start{background:var(--blue);color:#fff}#stop{background:#1a2347;color:#dbe4ff}
.result{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:14px;background:#111936;border:1px solid #1d2a55;color:#c9d3ea;overflow-wrap:anywhere}
.result.result-good{background:#0b2a22;border-color:#17614a;color:#c9f5e0}.result.result-bad{background:#2c0f12;border-color:#7a2630;color:#ffd5d5}
.result .head{font-size:16px;font-weight:700;color:#fff}
.ticket-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.ticket-detail div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px}
.ticket-detail small{display:block;opacity:.7;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.ticket-detail strong{display:block;margin-top:4px;color:#fff;overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<link rel="stylesheet" href="keyboard-safe.css?v=84"><script src="keyboard-safe.js?v=84" defer></script></head>
<body>
<header><span class="brand">BASSE · LIVE SCANNER</span><button class="exit" type="button" onclick="location.assign('/scanner.html')">Exit</button></header>
<main>
 <div class="top"><div><h1>Scan a ticket</h1><div class="sub" id="eventHint">Each ticket can be used once</div></div><div class="counts"><div class="count ok"><b id="cOk">0</b><small>Valid</small></div><div class="count bad"><b id="cBad">0</b><small>Invalid</small></div></div></div>
 <section class="cam" id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame"><div class="box"><i></i><i></i><i></i><i></i><span class="line"></span></div></div>
  <div class="hint" id="hint">Point the camera at a ticket QR code</div>
  <button class="soundchip" id="soundChip" type="button" hidden>🔊 Tap to turn sound on</button>
  <div class="verdict" id="verdict" hidden aria-live="assertive"><div class="vicon" id="vicon"></div><div class="vtitle" id="vtitle"></div><div class="vmsg" id="vmsg"></div><div class="vmeta" id="vmeta"></div></div>
 </section>
 <div class="row"><button class="act" id="start" type="button">Start camera</button><button class="act" id="stop" type="button">Stop camera</button></div>
 <div id="result" class="result" aria-live="polite">Opening camera…</div>
</main>
<script>
const $=id=>document.getElementById(id);let stream=null,loop=null,token=sessionStorage.getItem('basseScannerToken')||'',busy=false,vTimer=null,actx=null,counts={ok:0,bad:0};
const ICON_OK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',ICON_BAD='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
/* ---- sound: a bright two-note "ting" for valid, a low double buzz for invalid ---- */
function ensureAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;actx=new AC()}if(actx.state==='suspended')actx.resume();return actx.state==='running'}catch(e){return false}}
function tone(freq,at,dur,type,vol){const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+at;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.03)}
function playOk(){if(!ensureAudio())return;tone(1175,0,.45,'sine',.5);tone(1760,.1,.75,'sine',.42);tone(3520,.1,.4,'sine',.06)}
function playBad(){if(!ensureAudio())return;tone(185,0,.3,'sawtooth',.32);tone(138,.34,.5,'sawtooth',.32)}
function buzz(ok){try{navigator.vibrate&&navigator.vibrate(ok?[90]:[220,90,220])}catch(e){}}
function syncSoundChip(){const on=!!actx&&actx.state==='running';$('soundChip').hidden=on}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ensureAudio();setTimeout(syncSoundChip,60)},{passive:true}));
$('soundChip').onclick=()=>{ensureAudio();playOk();setTimeout(syncSoundChip,80)};
/* ---- verdict shown inside the camera ---- */
function showVerdict(ok,msg,data){
 data=data||{};const cam=$('cam'),v=$('verdict');clearTimeout(vTimer);
 const used=/already|used|checked/i.test(msg||'');
 cam.classList.remove('ok','bad');cam.classList.add(ok?'ok':'bad');v.className='verdict '+(ok?'ok':'bad');
 $('vicon').innerHTML=ok?ICON_OK:ICON_BAD;$('vtitle').textContent=ok?'VALID':(used?'ALREADY USED':'INVALID');
 $('vmsg').textContent=ok?'Entry allowed':(msg||'This ticket cannot be admitted');
 const meta=$('vmeta');meta.replaceChildren();[data.ticketType,data.price==null?null:'D'+Number(data.price).toLocaleString(),data.eventTitle].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.textContent=t;meta.append(s)});
 v.hidden=false;counts[ok?'ok':'bad']++;$('cOk').textContent=counts.ok;$('cBad').textContent=counts.bad;
 ok?playOk():playBad();buzz(ok);
 vTimer=setTimeout(()=>{v.hidden=true;cam.classList.remove('ok','bad')},2600)}
function showResult(ok,message,data){
 data=data||{};const r=$('result');r.className='result '+(ok?'result-good':'result-bad');r.replaceChildren();
 const h=document.createElement('div');h.className='head';h.textContent=(ok?'✅ ':'⛔ ')+message;r.append(h);
 if(data.eventTitle||data.ticketType||data.paymentStatus||data.entryStatus){const grid=document.createElement('div');grid.className='ticket-detail';
  [['Event',data.eventTitle||'Not matched'],['Ticket type',data.ticketType||'Unknown'],['Price',data.price==null?'—':'D'+Number(data.price).toLocaleString()],['Payment',data.paymentStatus||'—'],['Entry',data.entryStatus||(ok?'USED':'NOT ADMITTED')],['Scanned by',data.checkedInBy||'—']].forEach(([label,value])=>{const cell=document.createElement('div'),small=document.createElement('small'),strong=document.createElement('strong');small.textContent=label;strong.textContent=value;cell.append(small,strong);grid.append(cell)});r.append(grid)}}
function stopCamera(){if(loop)clearInterval(loop);loop=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}
async function verify(code){
 if(busy)return;code=String(code||'').trim();
 if(!/^.{8,100}$/.test(code)){showResult(false,'Enter or scan a valid ticket code.');showVerdict(false,'Not a valid ticket code');return}
 if(!/^\d{8}$/.test(token)){showResult(false,'Scanner access expired. Exit and reopen the scanner using your 8-digit access code.');showVerdict(false,'Scanner access expired');return}
 busy=true;$('hint').textContent='Checking ticket…';
 try{const r=await fetch('/api/events/scan',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({ticketCode:code})});let j={};try{j=await r.json()}catch(e){}
  const msg=j.message||j.error||'Ticket check failed.',ok=!!(r.ok&&j.ok);showResult(ok,msg,j);showVerdict(ok,msg,j);if(ok)$('result').setAttribute('data-last-scan','success')}
 catch(e){showResult(false,'Connection error. Check internet and retry.');showVerdict(false,'Connection error. Try again.')}
 finally{busy=false;$('hint').textContent='Point the camera at a ticket QR code'}}
$('stop').onclick=stopCamera;
async function startScanLoop(){
 const v=$('video');if(!stream||!v.videoWidth)return;
 const detector=('BarcodeDetector'in window)?new BarcodeDetector({formats:['qr_code']}):null;
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 loop=setInterval(async()=>{
  if(busy||v.readyState<2)return;
  try{let value='';
   if(detector){const found=await detector.detect(v);if(found.length)value=found[0].rawValue||''}
   else if(window.jsQR){canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height);const found=jsQR(frame.data,frame.width,frame.height,{inversionAttempts:'attemptBoth'});if(found)value=found.data}
   if(value){clearInterval(loop);loop=null;await verify(value);setTimeout(()=>{if(stream&&!loop)startScanLoop()},2700)}
  }catch(e){}
 },300)}
$('start').onclick=async()=>{
 ensureAudio();
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('This browser cannot access the camera. Open the secure HTTPS site in Safari or Chrome.');
  stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('video');v.srcObject=stream;await v.play();startScanLoop();
  $('result').className='result result-good';$('result').textContent='Camera ready. Point it at a ticket QR code.';setTimeout(syncSoundChip,200)
 }catch(e){showResult(false,e.message||'Could not open camera. Check browser camera permission.')}};
if(!/^\d{8}$/.test(token)){showResult(false,'Scanner access missing. Exit and reopen using the 8-digit code.')}else{$('start').click()}
setTimeout(syncSoundChip,600);
window.addEventListener('pagehide',stopCamera);
window.__verify=verify;
</script>
</body>
</html>
