<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Event Scanner | BASSE ONLINE SHOP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#14213d;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#071a4a;color:#fff;padding:18px;font-weight:900}.wrap{max-width:720px;margin:24px auto;padding:0 16px 50px}.card{background:#fff;border:1px solid #e0e6f0;border-radius:20px;padding:22px;margin:16px 0}label{display:block;font-weight:750;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-size:16px}button{background:#1748a8;color:white;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:800;width:100%;margin-top:12px}.secondary{background:#edf2fa;color:#14213d}.muted{color:#637089;line-height:1.55}.result{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}video{width:100%;max-height:360px;background:#111;border-radius:12px;margin-top:12px}.row{display:flex;gap:10px}.row button{flex:1}@media(max-width:520px){.wrap{margin-top:12px}.card{padding:16px}}
</style></head><body><header class="top">BASSE ONLINE SHOP · Event Scanner</header><main class="wrap"><section class="card"><h1>Validate event tickets</h1><p class="muted">For authorized staff only. Enter the event-specific scanner token supplied by the administrator. Keep it private. Each ticket can be checked in only once.</p><label>Scanner access token</label><input id="token" type="password" autocomplete="off" placeholder="Paste your private scanner token"><button id="open">Open scanner</button><p id="status" class="result muted"></p></section><section id="scanner" class="card hidden"><h2>Scan a ticket</h2><video id="video" playsinline></video><div class="row"><button id="start">Start camera</button><button id="stop" class="secondary">Stop camera</button></div><label>Or enter ticket code manually</label><input id="code" autocomplete="off" placeholder="Ticket code"><button id="verify">Verify ticket</button><p id="result" class="result"></p></section></main><script>
const $=id=>document.getElementById(id);let stream=null,loop=null,token='';
$('open').onclick=()=>{token=$('token').value.trim();if(token.length<32){$('status').textContent='Enter the full scanner token from the administrator.';return}sessionStorage.setItem('basseScannerToken',token);$('scanner').classList.remove('hidden');$('status').textContent='Scanner access token loaded for this browser session.'};
async function verify(code){if(!token)token=sessionStorage.getItem('basseScannerToken')||'';if(!token){$('result').textContent='Open scanner with your token first.';return}if(!code){$('result').textContent='Enter or scan a ticket code.';return}$('result').textContent='Checking ticket…';try{const r=await fetch('/api/events/scan',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({ticketCode:code})});const j=await r.json();if(!r.ok)throw Error(j.error||'Ticket check failed');$('result').textContent=(j.ok?'✅ ':'⛔ ')+j.message}catch(e){$('result').textContent='⛔ '+e.message}}
$('verify').onclick=()=>verify($('code').value.trim());
$('start').onclick=async()=>{if(!('BarcodeDetector'in window)){$('result').textContent='This browser does not support QR camera scanning. Enter the ticket code manually or use a supported browser.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('video');v.srcObject=stream;await v.play();const detector=new BarcodeDetector({formats:['qr_code']});loop=setInterval(async()=>{if(v.readyState<2)return;try{const codes=await detector.detect(v);if(codes.length&&codes[0].rawValue){clearInterval(loop);await verify(codes[0].rawValue);setTimeout(()=>$('start').click(),1800)}}catch{}},350);$('result').textContent='Camera ready. Scan one QR code at a time.'}catch(e){$('result').textContent='Camera could not start. Allow camera permission or enter the ticket code manually.'}};
$('stop').onclick=()=>{clearInterval(loop);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('result').textContent='Camera stopped.'};
const saved=sessionStorage.getItem('basseScannerToken');if(saved){$('token').value=saved;token=saved;$('scanner').classList.remove('hidden')}
</script></body></html>
