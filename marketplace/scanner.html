<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Event Scanner | BASSE ONLINE SHOP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#14213d;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#071a4a;color:#fff;padding:18px;font-weight:900}.wrap{max-width:720px;margin:24px auto;padding:0 16px 50px}.card{background:#fff;border:1px solid #e0e6f0;border-radius:20px;padding:22px;margin:16px 0}label{display:block;font-weight:750;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-size:16px}button{background:#1748a8;color:white;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:800;width:100%;margin-top:12px}.secondary{background:#edf2fa;color:#14213d}.muted{color:#637089;line-height:1.55}.result{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}video{width:100%;height:min(58dvh,560px);object-fit:cover;background:#111;border-radius:16px;margin-top:12px}.scanner-full{min-height:calc(100dvh - 100px)}.scanner-full h2{font-size:clamp(25px,5vw,34px)}.result-good{background:#e8f8ee;color:#116329;border:1px solid #9ad8ad;border-radius:12px;padding:14px;font-weight:850}.result-bad{background:#fff0f0;color:#9f1239;border:1px solid #f0b3bf;border-radius:12px;padding:14px;font-weight:850}.row{display:flex;gap:10px}.row button{flex:1}@media(max-width:520px){.wrap{margin-top:12px}.card{padding:16px}}
</style><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body><header class="top">BASSE ONLINE SHOP · Event Scanner</header><main class="wrap"><section id="accessCard" class="card"><h1>Validate event tickets</h1><p class="muted">For authorized staff only. Enter the 8-digit event access code supplied by the administrator. Keep it private. Each ticket can be checked in only once.</p><label>8-digit scanner access code</label><input id="token" type="password" autocomplete="off" placeholder="Enter 8-digit code"><button id="open">Open scanner</button><p id="status" class="result muted"></p></section><section id="scanner" class="card hidden scanner-full"><button id="backAccess" type="button" class="secondary">← Scanner access</button><h2>Scan a ticket</h2><p class="muted">Camera check-in · One-time entry validation</p><video id="video" playsinline></video><div class="row"><button id="start">Start camera</button><button id="stop" class="secondary">Stop camera</button></div><label>Or enter ticket code manually</label><input id="code" autocomplete="off" placeholder="Ticket code"><button id="verify">Verify ticket</button><p id="result" class="result"></p></section></main><script>
const $=id=>document.getElementById(id);let stream=null,loop=null,token='';
$('open').onclick=()=>{token=$('token').value.trim();if(!/^\d{8}$/.test(token)){$('status').textContent='Enter the 8-digit code from the administrator.';return}sessionStorage.setItem('basseScannerToken',token);location.assign('/scanner-live.html')};$('backAccess').onclick=()=>{stopCamera();$('scanner').classList.add('hidden');$('accessCard').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
function stopCamera(){clearInterval(loop);loop=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if($('video'))$('video').srcObject=null}async function verify(code){if(!token)token=sessionStorage.getItem('basseScannerToken')||'';if(!token){$('result').textContent='Open scanner with your token first.';return}if(!code){$('result').textContent='Enter or scan a ticket code.';return}$('result').textContent='Checking ticket…';try{const r=await fetch('/api/events/scan',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({ticketCode:code})});let j={};try{j=await r.json()}catch{}const detail=j.message||j.error||'Ticket check failed';$('result').className='result '+(r.ok&&j.ok?'result-good':'result-bad');$('result').textContent=(r.ok&&j.ok?'✅ ':'⛔ ')+(detail==='Ticket not found.'?'Ticket not found. Confirm that the QR belongs to the event assigned to this scanner.':detail)}catch(e){$('result').className='result result-bad';$('result').textContent='⛔ '+e.message}}
$('verify').onclick=()=>verify($('code').value.trim());
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('video');v.srcObject=stream;await v.play();const detector=('BarcodeDetector'in window)?new BarcodeDetector({formats:['qr_code']}):null;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});loop=setInterval(async()=>{if(v.readyState<2)return;try{let value='';if(detector){const codes=await detector.detect(v);if(codes.length)value=codes[0].rawValue||''}else if(window.jsQR){canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(frame.data,frame.width,frame.height,{inversionAttempts:'attemptBoth'});if(code)value=code.data}if(value){clearInterval(loop);await verify(value);setTimeout(()=>$('start').click(),1800)}}catch{}},350);$('result').textContent='Camera ready. Point the camera at a PAID ticket QR code for the event assigned to this scanner.'}catch(e){$('result').textContent='Camera could not start. Allow camera permission or enter the ticket code manually.'}};
$('stop').onclick=()=>{stopCamera();$('result').className='result';$('result').textContent='Camera stopped.'};
const saved=sessionStorage.getItem('basseScannerToken');if(saved){$('token').value=saved;token=saved;$('accessCard').classList.add('hidden');$('scanner').classList.remove('hidden')}
</script></body></html>
