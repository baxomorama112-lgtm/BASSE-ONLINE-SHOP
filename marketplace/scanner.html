<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Event Scanner | BASSE ONLINE SHOP</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#14213d;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#071a4a;color:#fff;padding:18px max(18px,calc((100% - 900px)/2));font-weight:900}.wrap{max-width:900px;margin:28px auto;padding:0 16px 50px}.card{background:#fff;border:1px solid #dce5f2;border-radius:24px;padding:26px;margin:16px 0;box-shadow:0 8px 28px #14213d08}h1{font-size:clamp(28px,5vw,42px);margin:4px 0 12px}.muted{color:#637089;line-height:1.6;font-size:clamp(16px,2.8vw,21px)}label{display:block;font-weight:850;margin:22px 0 8px;font-size:18px}input{width:100%;padding:18px;border:2px solid #cbd5e1;border-radius:16px;font:inherit;font-size:22px;letter-spacing:.25em}button{background:#24499d;color:white;border:0;border-radius:16px;padding:18px;font:inherit;font-weight:900;width:100%;margin-top:14px;cursor:pointer}.result{color:#637089;line-height:1.5;min-height:24px}@media(max-width:520px){.wrap{margin:12px auto}.card{padding:20px}}
</style><link rel="stylesheet" href="keyboard-safe.css?v=81"><script src="keyboard-safe.js?v=81" defer></script></head><body><header class="top">BASSE ONLINE SHOP · EVENT SCANNER</header><main class="wrap"><section class="card"><h1>Validate event tickets</h1><p class="muted">Authorized staff only. Enter the 8-digit event access code supplied by the administrator. Each paid ticket can be checked in once. The camera scanner will show the event, ticket type, price and admission result.</p><label for="token">8-digit scanner access code</label><input id="token" type="password" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••••••"><button id="open">Open camera scanner</button><p id="status" class="result" aria-live="polite"></p></section></main><script>const tokenInput=document.getElementById('token'),status=document.getElementById('status');function openScanner(){const token=tokenInput.value.trim();if(!/^\d{8}$/.test(token)){status.textContent='Enter the 8-digit code supplied by the administrator.';return}sessionStorage.setItem('basseScannerToken',token);location.assign('/scanner-live.html')}document.getElementById('open').addEventListener('click',openScanner);tokenInput.addEventListener('keydown',e=>{if(e.key==='Enter')openScanner()});const saved=sessionStorage.getItem('basseScannerToken');if(/^\d{8}$/.test(saved||'')){tokenInput.value=saved;status.textContent='Access code saved for this browser session.'}</script></body></html>
