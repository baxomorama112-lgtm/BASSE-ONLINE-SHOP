<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a4a"><title>Event Scanner | BASSE ONLINE SHOP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#14213d;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#071a4a;color:#fff;padding:16px;font-weight:900}.wrap{max-width:720px;margin:22px auto;padding:0 14px 40px}.card{background:#fff;border:1px solid #dfe6f1;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 10px 28px #10204b08}h1{font-size:clamp(26px,6vw,38px);line-height:1.12;margin:0 0 16px}h2{margin-top:0}.muted{color:#637089;line-height:1.55}label{display:block;font-weight:800;margin:14px 0 6px}input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;font:inherit;font-size:18px}button{background:#1748a8;color:white;border:0;border-radius:13px;padding:15px;font:inherit;font-weight:850;width:100%;margin-top:12px;cursor:pointer}.secondary{background:#edf2fa;color:#14213d}.result{padding:13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:750}.result.good{background:#dcfce7;color:#166534;border:1px solid #86efac}.result.bad{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}.hidden{display:none!important}.camera-screen{position:fixed;inset:0;z-index:100;background:#050914;color:white;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);overflow:auto}.camera-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.camera-head h2{margin:0;font-size:20px}.close{width:auto;margin:0;padding:10px 14px;background:#243047}.camera-stage{position:relative;flex:1;min-height:240px;display:flex;align-items:center;justify-content:center;background:#111827;border-radius:20px;overflow:hidden;margin:10px 0}.camera-stage video{width:100%;height:100%;max-height:62vh;object-fit:cover}.scan-frame{position:absolute;width:min(72vw,310px);aspect-ratio:1;border:4px solid #22c55e;border-radius:22px;box-shadow:0 0 0 999px #0005,0 0 24px #22c55e55;pointer-events:none}.scan-line{position:absolute;left:8%;right:8%;height:3px;background:#4ade80;box-shadow:0 0 12px #22c55e;animation:sweep 2s ease-in-out infinite;pointer-events:none}@keyframes sweep{0%,100%{top:22%}50%{top:76%}}.camera-bottom{padding:8px 0 16px}.camera-bottom input{background:#fff;color:#14213d}.camera-bottom .row{display:flex;gap:8px}.camera-bottom .row button{flex:1}.hint{font-size:13px;color:#cbd5e1;text-align:center}@media(max-width:520px){.wrap{margin-top:12px}.card{padding:17px}.camera-stage video{max-height:58vh}}
</style><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script></head><body><header class="top">BASSE ONLINE SHOP · EVENT SCANNER</header><main class="wrap"><section class="card"><h1>Validate event tickets</h1><p class="muted">Authorized staff only. Enter the 8-digit event access code supplied by the administrator. Each paid ticket can be checked in once.</p><label for="token">8-digit scanner access code</label><input id="token" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••••"><button id="open">Open camera scanner</button><p id="status" class="muted"></p></section><section class="card"><h2>Manual ticket check</h2><label for="manualCode">Ticket code</label><input id="manualCode" autocomplete="off" placeholder="Scan QR or enter ticket code"><button id="manualVerify">Verify ticket</button><p id="manualResult" class="result hidden"></p></section></main><section id="cameraScreen" class="camera-screen hidden" aria-label="Full-screen ticket camera"><div class="camera-head"><h2>Scan a ticket</h2><button class="close" id="closeCamera">Close ✕</button></div><div class="camera-stage"><video id="video" playsinline muted></video><div class="scan-frame"></div><div class="scan-line"></div></div><div class="camera-bottom"><p class="hint">Align the QR code inside the green frame. The result appears here.</p><p id="scanResult" class="result hidden"></p><label for="cameraManual">Or enter ticket code manually</label><input id="cameraManual" autocomplete="off" placeholder="Ticket code"><div class="row"><button id="cameraVerify">Verify code</button><button id="restartCamera" class="secondary">Restart camera</button></div></div></section><script>
const $=id=>document.getElementById(id);let stream=null,loop=null,token='',busy=false,lastCode='',lastAt=0;const saved=sessionStorage.getItem('basseScannerToken');if(saved){token=saved;$('token').value=saved;$('status').textContent='Access code loaded for this browser session.'}
function showResult(el,ok,msg){el.classList.remove('hidden','good','bad');el.classList.add(ok?'good':'bad');el.textContent=(ok?'✓ ':'✕ ')+msg}
async function verify(code,target){code=String(code||'').trim();if(!token)token=sessionStorage.getItem('basseScannerToken')||'';if(!/^\d{8}$/.test(token)){showResult(target,false,'Enter the authorized 8-digit scanner code first.');return}if(!code){showResult(target,false,'Scan a QR code or enter the ticket code.');return}if(busy)return;busy=true;target.classList.remove('hidden');target.className='result';target.textContent='Checking ticket…';try{const r=await fetch('/api/events/scan',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({ticketCode:code})});const j=await r.json();showResult(target,!!j.ok,j.message||j.error||'Ticket check failed.');if(j.ok){$('manualCode').value='';$('cameraManual').value='';lastCode=code;lastAt=Date.now()} }catch(e){showResult(target,false,'Could not reach the server. Check the connection and try again.')}finally{busy=false}}
async function stopCamera(){clearInterval(loop);loop=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}
async function startCamera(){await stopCamera();try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera unavailable');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();const detector=('BarcodeDetector'in window)?new BarcodeDetector({formats:['qr_code']}):null,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});loop=setInterval(async()=>{const v=$('video');if(busy||v.readyState<2)return;try{let value='';if(detector){const codes=await detector.detect(v);if(codes.length)value=codes[0].rawValue||''}else if(window.jsQR){canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0,canvas.width,canvas.height);const f=ctx.getImageData(0,0,canvas.width,canvas.height),q=jsQR(f.data,f.width,f.height,{inversionAttempts:'attemptBoth'});if(q)value=q.data}if(value&&!(value===lastCode&&Date.now()-lastAt<2500))await verify(value,$('scanResult'))}catch{}},250);$('scanResult').classList.add('hidden')}catch(e){showResult($('scanResult'),false,'Camera could not start. Allow camera access and use HTTPS, or enter the ticket code below.')}}
$('open').onclick=async()=>{token=$('token').value.trim();if(!/^\d{8}$/.test(token)){$('status').textContent='Enter the 8-digit code supplied by the administrator.';return}sessionStorage.setItem('basseScannerToken',token);$('status').textContent='Access verified for this browser session.';$('cameraScreen').classList.remove('hidden');document.body.style.overflow='hidden';await startCamera()};$('closeCamera').onclick=async()=>{await stopCamera();$('cameraScreen').classList.add('hidden');document.body.style.overflow=''};$('restartCamera').onclick=startCamera;$('manualVerify').onclick=()=>verify($('manualCode').value,$('manualResult'));$('cameraVerify').onclick=()=>verify($('cameraManual').value,$('scanResult'));$('manualCode').addEventListener('keydown',e=>{if(e.key==='Enter')verify(e.currentTarget.value,$('manualResult'))});$('cameraManual').addEventListener('keydown',e=>{if(e.key==='Enter')verify(e.currentTarget.value,$('scanResult'))});window.addEventListener('pagehide',stopCamera);
</script></body></html>
