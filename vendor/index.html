<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASSE MARKET • Vendor</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="login"><div class="card"><div class="logo">B</div><h1>Vendor Dashboard</h1><p>Manage your BASSE MARKET shop.</p><input id="phone" autocomplete="tel" inputmode="numeric" placeholder="WhatsApp number"><input id="pin" autocomplete="one-time-code" inputmode="numeric" maxlength="5" type="password" placeholder="4–5 digit PIN"><button type="button" onclick="login()">LOGIN</button><a class="create-account" href="/?vendor=apply">＋ CREATE VENDOR ACCOUNT</a><a href="/">← Back to marketplace</a></div></div><div id="app" class="hidden"><header><b>🏪 <span id="shop">My Shop</span></b><button onclick="logout()">Logout</button></header><main><div class="stats"><div><span>Live Products</span><b id="products">0</b></div><div><span>Pending Approval</span><b id="pending">0</b></div><div><span>Paid Sales</span><b id="sales">D0</b></div><div><span>Your Earnings</span><b id="earnings">D0</b></div></div><section class="card"><div class="bar"><div><h2>My Products</h2><small>Products stay hidden until Admin approves them.</small></div><button onclick="openAdd()">+ ADD PRODUCT</button></div><div id="productsList"></div></section><section class="card"><h2>My Orders</h2><div id="orders"></div></section></main></div><div id="modal" class="modal hidden"><div class="card" id="form"></div></div><script src="app.js"></script></body></html>
